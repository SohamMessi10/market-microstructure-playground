[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-microstructure-playground"
version = "0.1.0"
description = "A limit order book and matching engine with price-time priority, built to be stepped through by hand."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Versions were each released at least two weeks before they were pinned.
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.170,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
